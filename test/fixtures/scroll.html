<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scroll</title>
<style>
  body { margin: 0; font: 16px system-ui, sans-serif; }
  #sheet { position: absolute; left: 20px; top: 20px; width: 300px; height: 200px; overflow-y: auto; border: 1px solid #888; }
  #sheet p { height: 100px; margin: 0; }
  #tall { height: 2000px; }
</style>
</head>
<body>
<div id="sheet"><p>One</p><p>Two</p><p>Three</p><p>Four</p><p>Five</p></div>
<div id="tall"></div>
</body>
</html>
