# game-r.yaml — every user option lives here.
# `defaults` apply to every campaign; a campaign overrides only what it sets.
# Keep your own campaigns and settings (say, notify.command) in game-r.local.yaml beside this file (gitignored):
# game-r merges it over this one, defaults deep-merged and campaigns added, or deep-merged by name.
# Secrets never go in this file: API keys are read from the environment variable named in model.api_key_env,
# or from the gitignored secrets file (model.secrets_file, ./.env by default).

defaults:
  model:
    # Who plays:
    #   claude-code        Claude Code (`claude -p`) on your Claude subscription; plays through game-r's tools over MCP
    #   codex              Codex CLI (`codex exec`) on your ChatGPT subscription; the same, with its shell tool off
    #   openai-compatible  game-r's own loop over any Chat Completions API (OpenCode Go, OpenAI, OpenRouter, Ollama…)
    #   anthropic          game-r's own loop over the Claude API (not built yet)
    provider: claude-code
    name: sonnet                     # model id or CLI alias (claude-code: opus | sonnet | haiku | full id); null = the CLI's default.
                                     # Sonnet on high effort is the benchmark player.
    command: null                    # agent CLIs: path to the executable when it is not `claude` / `codex` on PATH
    base_url: null                   # openai-compatible: the API's base URL
    api_key_env: null                # openai-compatible / anthropic: name of the key, read from the environment, else from secrets_file
    secrets_file: ./.env             # NAME=value lines, gitignored (copy .env.example); keys stay out of the agent CLIs' environment
    headers: {}                      # openai-compatible: extra request headers; "{conversation}" becomes a per-conversation id
    max_output_tokens: 16000         # openai-compatible / anthropic
    request_timeout_seconds: 600     # openai-compatible / anthropic: how long one model reply may take (raise for slow local models)
    reasoning: high                  # effort, passed as given (claude-code --effort; codex model_reasoning_effort; reasoning_effort); off = don't send
    vision: true                     # false for text-only models: screenshots are saved but not sent
    # USD per million tokens, for cost tracking and limits.cost_usd with API providers. null = not tracked.
    # Agent CLIs report their own figures (Claude Code: an estimate; on a subscription nothing is billed per token).
    # cache_read / cache_write default to 0.1× and 1.25× input when not given.
    price_per_mtok: null
  browser:
    engine: chromium                 # chromium | firefox | webkit
    headless: true                   # false to watch it play
    device: desktop                  # "desktop" or a Playwright device name, e.g. "Pixel 7", "iPad Pro 11"
    viewport: null                   # [width, height] overrides the device's viewport
    profile: campaign                # campaign: saved game data persists across runs | run: fresh each run
    profile_from: null               # a saved profile to start from (a save point, e.g. saves/<name>/profile, copied, never changed):
                                     # the first run, and each run after one the agent ended (end_run, e.g. at a death), start from a
                                     # fresh copy, so a lost hero comes back as saved; a run after a stop, a limit or a crash carries on
    record_video: false
    trace: false
    keep_shots: referenced           # referenced: when the agent ends a run (end_run), keep only the screenshots (run-NNN/shots/)
                                     # that a file in the run folder or /memory names; a run ended any other way (a stop, a limit,
                                     # a crash) keeps them all | all: keep every one
  access: player                     # player | developer (developer adds the evaluate tool)
  clock: allowed                     # allowed | off (the agent may pause and advance game time)
  context:
    refresh_tokens: 200000           # keeps each player's context below about this many tokens. API providers: a fresh context
                                     # (from /memory). Claude Code: its auto-compaction window (--autocompact, 100k–1M; it compacts
                                     # about 30k below it). Codex: model_auto_compact_token_limit. Each new run starts a fresh session.
  limits:                            # hard stops; null = no limit
    runs: 10
    hours: 48
    cost_usd: null                   # needs price_per_mtok (API providers) or a CLI that reports cost
    calls_per_run: null              # tool calls per run, for every player; the run is sealed when it is reached
    wrap_up_minutes: 5               # the status line warns this long before the hours limit (and past 90% of cost_usd,
                                     # or with 10 calls left) so the agent can do its End step; no new run starts while the
                                     # time or cost warning is on; limits themselves stay hard
  pace:
    seconds_per_call: 0              # minimum seconds between game-tool calls (0 = off; max 600). Slows the agent to spread
                                     # a subscription's usage or an API budget over more hours; workspace tools are never paced.
                                     # Above ~300 s every call misses the prompt cache. Real-time games run on while it waits.
  notify:
    # Run with $GAMER_TITLE $GAMER_MESSAGE $GAMER_LEVEL $GAMER_EVENT $GAMER_CAMPAIGN set; refer to them, never paste game text in.
    # null = notifications are only logged (in the transcript and log.md); a failed command is logged as notify_failed.
    # macOS example: command: osascript -e 'display notification (system attribute "GAMER_MESSAGE") with title (system attribute "GAMER_TITLE")'
    command: null
    on: [agent, run_end, campaign_end, limit, error]
  system_prompt_file: null           # replace the built-in framework prompt (keep {{clock}} and {{developer}} placeholders)
  output: ./runs

# A campaign's instructions work best in three parts (all plain text, all optional but the goal):
#   Goal             what to achieve, as checkable criteria
#   Getting started  a known plan or direction for the opening: what to read first, what usually works.
#                    The agent follows it before anything else; the rest it learns and records itself.
#   Deliverables     what to report and where, beyond the framework's own memory and run reports
# To start a campaign with knowledge (say, the memory of an earlier campaign), put files in
# runs/<campaign>/memory/ before its first run: on the first run only the missing templates are copied.
# A run ends at each end point in the game (a death, a win, a game over), so in a roguelike `runs` counts
# deaths: bound such campaigns by hours, with runs: null.

campaigns:
  # The two example games. They run on the defaults above (Claude Code, Sonnet, high effort) unless they say otherwise.
  tome-ui:
    url: https://darrencroton.github.io/tales-of-middle-earth/
    browser: { device: "Pixel 7" }
    instructions: |
      Test ToME — Tales of Middle-earth as a phone player would. Create a hero and play normally,
      and look for UI bugs, quirks and anything confusing: layout in portrait and landscape,
      menus, sheets, cards, the toolbar, the inventory and the character screens.
      Write each finding to /run/findings.md with steps to reproduce, what you expected,
      what happened and a saved screenshot. Notify me of serious ones.
      Work for about 6 hours of wall time, starting new runs (new heroes) when it helps.

  tome-barrow:
    url: https://darrencroton.github.io/tales-of-middle-earth/
    browser: { device: "Pixel 7", headless: false }
    limits: { runs: null, hours: 0.5 } # a short sample: usage, cost and how the agent copes; raise to continue
    instructions: &barrow |
      Goal: create a new hero and take them to the bottom of the Barrow-downs, the first dungeon
      (dungeon level 10, 500 ft), alive. Play as a phone player would, through the game's own UI.

      Getting started, in this order:
      1. Read the game's Help and follow it. It is on the title screen, and in the game under ☰ Menu → Help.
         Read "Your first adventure" (under Start here) first, then the topics it links to,
         and write up what matters. Go back to Help whenever you are unsure.
      2. In Bree, walk into every shop and see what it sells. Then decide what equipment, food, light and
         healing you need, and buy it.
      3. Find the Barrow-downs: explore the current map along the path to the west. Explore does not find
         dungeon entrances on the land, so look for the entrance yourself; stand on it and the toolbar
         offers to take it.

      Deliverables: log depth, character level and hit points at each new dungeon level.
      Notify me when you reach each new dungeon level, and if the hero dies.

  # The same campaign on the other two players, for comparison with tome-barrow (Claude Code, Sonnet high).
  tome-barrow-codex:
    url: https://darrencroton.github.io/tales-of-middle-earth/
    browser: { device: "Pixel 7", headless: false }
    # Codex reports tokens but no cost; these are gpt-6.1-terra's API list prices (LiteLLM, as ccusage uses), for an estimate.
    model: { provider: codex, name: gpt-6.1-terra, reasoning: high, price_per_mtok: { input: 1, output: 5, cache_read: 0.05 } }
    limits: { runs: null, hours: 0.5 }
    instructions: *barrow

  tome-barrow-go:
    url: https://darrencroton.github.io/tales-of-middle-earth/
    browser: { device: "Pixel 7", headless: false }
    model: &go
      provider: openai-compatible
      name: deepseek-v4.1-flash      # OpenCode Go; takes images; reasoning low | high | max
      base_url: https://opencode.ai/inference/go/openai/v1
      api_key_env: OPENCODE_API_KEY
      headers: { x-opencode-session: "{conversation}" }
      reasoning: high
      # List prices in USD per million tokens, as OpenCode's own usage.opencode.list_cost reports them (models.dev lists
      # half this as an off-peak price). Go bills its allowance, so this is an API-equivalent estimate.
      price_per_mtok: { input: 0.30, output: 1.20, cache_read: 0.006 }
    limits: { runs: null, hours: 0.5 }
    instructions: *barrow

  drones-score:
    url: https://simonw.github.io/battledrones/
    model: { provider: codex, name: null }
    limits: { runs: 20 }
    instructions: |
      Play a Skirmish on Riverlands against the Normal AI and win as quickly as you can.
      After each match, record the result, the game time it took and what you would change,
      then start a new run and try to beat your best time.

  # A small local test game (test/fixtures/game.html), one campaign per way of playing, for trying the setup.
  # A local game may open files beside it (act goto), so keep each local game in its own folder.
  dodge:
    url: ./test/fixtures/game.html
    model: { name: haiku }
    limits: { runs: 1, hours: 0.08, wrap_up_minutes: 1 }   # a ~5-minute smoke test
    instructions: &dodge |
      This is a small test game. Survive as long as you can; your best score is the result.

  dodge-codex:
    url: ./test/fixtures/game.html
    model: { provider: codex, name: gpt-6.1-terra, reasoning: low, price_per_mtok: { input: 1, output: 5, cache_read: 0.05 } }
    limits: { runs: 1, hours: 0.08, wrap_up_minutes: 1 }   # a ~5-minute smoke test
    instructions: *dodge

  dodge-go:
    url: ./test/fixtures/game.html
    model: { <<: *go, reasoning: low }
    limits: { runs: 1, hours: 0.08, wrap_up_minutes: 1 }   # a ~5-minute smoke test
    instructions: *dodge
